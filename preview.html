<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frontline Advisor — window mockups</title>
<style>
  :root{
    --bg:#16171d; --text:#f0f2fa; --dim:#9aa2bd; --gold:#facc47;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0d0e12;color:var(--text);
       font-family:"Segoe UI",Roboto,system-ui,sans-serif;padding:32px 24px 48px}
  h1{color:var(--gold);font-size:1.4rem;margin:0 0 6px}
  .intro{color:var(--dim);font-size:.9rem;margin:0 0 28px;max-width:640px;line-height:1.45}
  .grid{display:grid;gap:36px;max-width:1100px;margin:0 auto}
  figure{margin:0}
  figcaption{color:var(--dim);font-size:.82rem;margin:10px 0 0;line-height:1.4}
  figcaption strong{color:var(--text);font-weight:600}
  img{display:block;max-width:100%;height:auto;border-radius:8px;
      box-shadow:0 18px 48px rgba(0,0,0,.45);border:1px solid #2c3040}
  .note{margin-top:36px;color:#5a6079;font-size:.75rem;text-align:center}
  a{color:var(--gold)}
</style>
</head>
<body>
  <div class="grid">
    <div>
      <h1>Frontline Advisor — simulated screenshots</h1>
      <p class="intro">
        Mockups of the Dalamud windows and a lead-change notice. Sample scores only —
        the live UI is drawn by the plugin. Sources live under
        <a href="docs/screenshots/">docs/screenshots/</a>.
      </p>
    </div>

    <figure>
      <img src="docs/screenshots/advisor_mid_match.png" alt="Advisor window mid-match on Secure">
      <figcaption><strong>Mid-match advisor</strong> — standings, focus, threat, posture and map note on Secure.</figcaption>
    </figure>

    <figure>
      <img src="docs/screenshots/advisor_idle.png" alt="Advisor window while not in a match">
      <figcaption><strong>Idle</strong> — waiting for a Frontline queue.</figcaption>
    </figure>

    <figure>
      <img src="docs/screenshots/advisor_settings.png" alt="Settings window">
      <figcaption><strong>Settings</strong> — announce toggles, delivery, team, map and tuning.</figcaption>
    </figure>

    <figure>
      <img src="docs/screenshots/advisor_lead_change.png" alt="Lead-change chat line and screen toast">
      <figcaption><strong>Lead-change notice</strong> — chat line plus screen toast when another company takes the lead.</figcaption>
    </figure>
  </div>
  <p class="note">Mockups only — not captures from a live client.</p>
</body>
</html>
